name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint / Typecheck / Build / Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: TypeScript (worker)
        run: npm run typecheck:party

      - name: Build production
        run: npm run build

      - name: npm audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Knip (unused exports / files)
        run: npm run knip

  smoke:
    name: Backend smokes (room / election / security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Setup wrangler dev env (short admin grace)
        run: echo "POKRR_ADMIN_GRACE_MS=2000" > .env

      - name: Start wrangler dev in background
        run: |
          npm run dev:party > /tmp/wrangler-dev.log 2>&1 &
          echo $! > /tmp/wrangler-dev.pid
          for i in $(seq 1 60); do
            if nc -z localhost 1999 2>/dev/null; then
              echo "wrangler dev up after ${i}s"
              sleep 2
              break
            fi
            sleep 1
          done

      - name: Smoke — happy path
        run: npm run smoke

      - name: Smoke — security
        run: npm run smoke:security

      - name: Smoke — admin election
        run: npm run smoke:election

      - name: Dump wrangler dev logs on failure
        if: failure()
        run: tail -100 /tmp/wrangler-dev.log || true

      - name: Cleanup
        if: always()
        run: kill $(cat /tmp/wrangler-dev.pid) 2>/dev/null || true
